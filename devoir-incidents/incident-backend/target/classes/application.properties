server.port=8080
spring.application.name=incident-backend

# ---- H2 (par defaut, base en memoire) ----
spring.datasource.url=jdbc:h2:mem:incidentdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---- MySQL (alternative : decommenter et commenter H2) ----
# spring.datasource.url=jdbc:mysql://localhost:3306/incidentdb?createDatabaseIfNotExist=true&serverTimezone=UTC
# spring.datasource.username=root
# spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---- JWT ----
# Cle HS256 : au moins 32 caracteres. A remplacer en production (variable d'environnement JWT_SECRET).
app.jwt.secret=${JWT_SECRET:change-me-please-this-secret-must-be-at-least-32-bytes-long}
# 5 minutes pour pouvoir tester l'expiration
app.jwt.expiration-ms=300000
app.jwt.refresh-expiration-days=7

# ---- CORS ----
app.cors.allowed-origin=http://localhost:5173
